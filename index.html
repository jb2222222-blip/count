<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CountDown Widget Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0f19" />
  <style>
    :root {
      --bg: #070a13;
      --card-bg: #10162a;
      --card-border: #1e294b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #6366f1;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --sub-btn: #18223d;
      --sub-btn-border: #283556;
      --badge-bg: #1c2541;
      --badge-accent: #f97316;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Nav Pill */
    .top-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .pill-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
    }

    /* Main Card */
    .widget-card {
      background: radial-gradient(circle at top right, #1a2244 0%, var(--card-bg) 65%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge-group {
